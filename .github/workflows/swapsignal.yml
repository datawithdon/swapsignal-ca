name: SwapSignal

on:
  schedule:
    - cron: "0 11 * * *"      # forecast: daily, ~6–7am Eastern
    - cron: "20 */2 * * *"    # shops: every 2 hours
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [forecast, shops, test-push]
        default: forecast

permissions:
  contents: read

concurrency:
  group: swapsignal-state
  cancel-in-progress: false

jobs:
  run:
    # Scheduled runs stay off until you set the repo variable SWAPSIGNAL_ENABLED=true
    # (after adding your secrets); manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.SWAPSIGNAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # choice input / fixed schedule string only, and used via "$TASK", never inlined into a script
      TASK: ${{ github.event.schedule == '20 */2 * * *' && 'shops' || inputs.task || 'forecast' }}
    steps:
      # Actions pinned to commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Audit dependencies
        # pip-audit gets its own hash-locked venv so it can't touch the app's packages.
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --require-hashes -r requirements-audit.txt
          "$RUNNER_TEMP/audit/bin/pip-audit" --strict --no-deps --disable-pip -r requirements.txt
      - name: Allow Chrome's sandbox
        if: env.TASK == 'shops'
        # Uses the runner's preinstalled Google Chrome (no browser download). Ubuntu 24.04
        # blocks the user namespaces Chrome's sandbox needs; allow them so the sandbox stays ON.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Restore state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: swapsignal-state-${{ github.run_id }}
          restore-keys: swapsignal-state-
      - name: Run
        # Secrets only reach this step, not the installs above.
        env:
          SWAP_LOCATION: ${{ secrets.SWAP_LOCATION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BOOK_URL: ${{ secrets.BOOK_URL }}
          SWAPSIGNAL_CONFIG: ${{ secrets.SWAPSIGNAL_CONFIG }}
          PLAYWRIGHT_CHANNEL: chrome
        run: python -m swapsignal "$TASK"
      - name: Save state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: swapsignal-state-${{ github.run_id }}-${{ github.run_attempt }}

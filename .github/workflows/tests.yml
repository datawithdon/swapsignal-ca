name: Tests

on:
  push:
    branches: [main]
  pull_request:          # no secrets, read-only token; never pull_request_target
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Audit dependencies
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --require-hashes -r requirements-audit.txt
          "$RUNNER_TEMP/audit/bin/pip-audit" --strict --no-deps --disable-pip -r requirements-dev.txt
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tests (real Chrome, sandbox on)
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: python -m pytest -v
